services:

  rabbitmq:
    image: rabbitmq:4.1.2-management
    ports:
      - "15672:15672"
      - "5672:5672"
    restart: on-failure
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - recommendation-service-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  database:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - recommendation-service-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    env_file:
      - .env
    volumes:
      - ./app:/app
    networks:
      - recommendation-service-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      database:
        condition: service_healthy

  web-proxy:
    image: nginx:1.29.0
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    networks:
      - recommendation-service-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

  ml_workers:
    build: ./ml_workers
    env_file:
      - .env
    volumes:
      - ./ml_workers:/ml_workers
    networks:
      - recommendation-service-network
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 2
      endpoint_mode: vip

  gradio_app:
    build: ./app/gradio_app
    env_file:
      - .env
    volumes:
      - ./app/gradio_app:/gradio_app
    networks:
      - recommendation-service-network
    depends_on:
      - app
      - rabbitmq
    ports:
      - "7860:7860"
    restart: unless-stopped


networks:
  recommendation-service-network:
    name: recommendation-service-network
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_volume:
